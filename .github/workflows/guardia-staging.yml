# Guardia de staging — solo se entra a staging por dos caminos:
#   1) PR desde `main`       (promoción normal: dev → main → staging)
#   2) PR desde `hotfix/*`   (corrección urgente probada en staging; se promueve después con
#                             "Promover hotfix de staging", que exige que el dueño la haya probado)
# Cualquier otro origen (rama personal, fork, push directo) se marca en rojo.
# Para que sea OBLIGATORIO, marca "Verificar origen del PR a staging" como check requerido en la
# protección/ruleset de la rama staging (ver docs del flujo de hotfix).
name: Guardia de staging

on:
  pull_request:
    branches: [staging]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: read

jobs:
  origen-del-pr:
    name: Verificar origen del PR a staging
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Solo main o hotfix/* pueden entrar a staging
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error title=Origen no permitido::Los PR desde forks no pueden entrar a staging."
            exit 1
          fi
          case "$HEAD_REF" in
            main|hotfix/*) echo "Origen permitido: $HEAD_REF → staging" ;;
            *)
              echo "::error title=Origen no permitido::A staging solo se entra desde 'main' o desde 'hotfix/*' (este PR viene de '$HEAD_REF'). Flujo normal: dev → main → staging. Urgente: rama hotfix/<descripcion> creada desde staging."
              exit 1 ;;
          esac

  push-sin-pr:
    name: Detectar push directo a staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: El commit debe venir de un PR permitido
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          consulta() {
            gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq '[.[] | select(.base.ref == "staging" and .merged_at != null) | .head.ref] | join(" ")'
          }
          origenes="$(consulta || true)"
          if [ -z "$origenes" ]; then sleep 8; origenes="$(consulta || true)"; fi
          if [ -z "$origenes" ]; then
            echo "::error title=Push directo a staging::El commit ${SHA:0:7} no pertenece a ningún PR fusionado. Alguien escribió directo en staging: revisa quién y qué cambió, y llévalo por PR (main o hotfix/*)."
            exit 1
          fi
          for o in $origenes; do
            case "$o" in
              main|hotfix/*) ;;
              *) echo "::error title=PR de origen no permitido::El commit ${SHA:0:7} entró por un PR desde '$o' (solo se permite main o hotfix/*)."; exit 1 ;;
            esac
          done
          echo "OK: commit ${SHA:0:7} entró por PR desde: $origenes"
