name: Deploy a produccion (VPS)

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    name: Pruebas (quality gate)
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: [self-hosted, gympro-vps]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar horario permitido (23:00-05:59 hora CDMX)
        run: |
          hora=$(TZ="America/Mexico_City" date +%H)
          ahora=$(TZ="America/Mexico_City" date '+%Y-%m-%d %H:%M %Z')
          if [ "$hora" -ge 23 ] || [ "$hora" -lt 6 ]; then
            echo "Hora actual en CDMX: $ahora. Dentro de la ventana permitida (23:00-05:59), continuando."
          else
            echo "::error::Son las $ahora en Ciudad de Mexico. El deploy a produccion solo se aplica entre 23:00 y 05:59 (gimnasio cerrado) para no interrumpir la operacion. Vuelve a correr este job (Re-run jobs) o dispara el workflow de nuevo dentro de ese horario."
            exit 1
          fi

      - name: Asegurar rsync en el runner
        run: command -v rsync >/dev/null || (apt-get update && apt-get install -y rsync)

      - name: Guardar version actual (para rollback)
        run: |
          S=~/GymPro-Prod/gympro-infra/deploy/scripts
          if [ -f "$S/snapshot-release.sh" ]; then bash "$S/snapshot-release.sh" prod gympro-api
          else echo "::warning::Scripts de despliegue no instalados en el VPS: despliega gympro-infra primero. Sin rollback en este despliegue."; fi

      - name: Sincronizar codigo con el clon persistente del VPS
        run: |
          echo "$GITHUB_SHA" > BUILD_INFO
          mkdir -p ~/GymPro-Prod/gympro-api
          rsync -a --delete --exclude='.env' --exclude='.git' ./ ~/GymPro-Prod/gympro-api/

      - name: Reconstruir stack de produccion
        id: build
        run: |
          cd ~/GymPro-Prod/gympro-infra
          docker compose -f docker-compose.server.yml up -d --build

      - name: Estado de los contenedores
        run: |
          cd ~/GymPro-Prod/gympro-infra
          sleep 5
          docker compose -f docker-compose.server.yml ps

      - name: Verificacion de salud post-despliegue
        id: salud
        run: |
          S=~/GymPro-Prod/gympro-infra/deploy/scripts
          if [ -f "$S/post-deploy-check.sh" ]; then bash "$S/post-deploy-check.sh" prod
          else echo "::warning::Sin scripts de verificacion en el VPS (despliega gympro-infra primero)."; fi

      - name: Rollback automatico a la version anterior
        id: rollback
        if: failure() && (steps.build.outcome == 'failure' || steps.salud.outcome == 'failure')
        run: bash ~/GymPro-Prod/gympro-infra/deploy/scripts/rollback.sh prod gympro-api

      - name: Notificar resultado del despliegue
        if: always()
        env:
          DEPLOY_ENV: prod
          DEPLOY_REPO: gympro-api
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.rollback.outcome }}" = "success" ]; then export DEPLOY_STATUS=revertido
          elif [ "${{ job.status }}" = "success" ]; then export DEPLOY_STATUS=exito
          else export DEPLOY_STATUS=fallo; fi
          S=~/GymPro-Prod/gympro-infra/deploy/scripts
          if [ -f "$S/notify.sh" ]; then bash "$S/notify.sh"; else echo "Despliegue: $DEPLOY_STATUS"; fi
